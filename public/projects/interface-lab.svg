<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d"><title id="t">Motion and interaction lab</title><desc id="d">An abstract tactile interface experiment using a warm paper surface, orbit lines and geometric controls.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6eee6"/><stop offset="1" stop-color="#e9d8ca"/></linearGradient><radialGradient id="orb"><stop stop-color="#f1d4bf"/><stop offset="1" stop-color="#d9a98d"/></radialGradient></defs><rect width="780" height="440" rx="12" fill="url(#bg)"/><text x="31" y="33" fill="#66564d" font-family="monospace" font-size="10" letter-spacing="1.5">INTERACTION STUDY / 003</text><text x="750" y="33" fill="#9e8878" text-anchor="end" font-family="monospace" font-size="9">MOTION WITH A REASON</text><path d="M30 54H750" stroke="#d9c5b6"/><text x="31" y="98" fill="#57473e" font-family="Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-1.2">Make the movement meaningful.</text><text x="32" y="123" fill="#957e6d" font-family="Arial,sans-serif" font-size="12">Explorations in rhythm, balance, and tactile feedback.</text><circle cx="394" cy="268" r="124" fill="url(#orb)" fill-opacity=".72"/><g fill="none" stroke="#9f7865" stroke-opacity=".7"><ellipse cx="394" cy="268" rx="169" ry="70" transform="rotate(-32 394 268)"/><ellipse cx="394" cy="268" rx="145" ry="52" transform="rotate(32 394 268)"/><circle cx="394" cy="268" r="95" stroke-dasharray="2 7"/><circle cx="394" cy="268" r="63"/></g><rect x="348" y="222" width="92" height="92" rx="27" fill="#faf4ed" stroke="#c5a18b" stroke-width="1.5" transform="rotate(-7 394 268)"/><path d="M382 247v42m12-51v60m12-42v24" stroke="#9d7966" stroke-width="5" stroke-linecap="round"/><circle cx="531" cy="193" r="9" fill="#c5ed8c" stroke="#faf4ed" stroke-width="4"/><circle cx="262" cy="318" r="6" fill="#8e9f7e" stroke="#faf4ed" stroke-width="3"/><circle cx="458" cy="354" r="5" fill="#b8a0c8" stroke="#faf4ed" stroke-width="3"/><text x="31" y="393" fill="#9e8878" font-family="monospace" font-size="9" letter-spacing="1.5">01 / SPATIAL FEEDBACK</text><text x="750" y="393" fill="#9e8878" text-anchor="end" font-family="monospace" font-size="9" letter-spacing="1.5">02 / CONTROL RHYTHM</text><path d="M31 410H750" stroke="#d9c5b6"/><text x="31" y="427" fill="#a28b7b" font-family="monospace" font-size="8">PROTOTYPE SERIES — NOT A FINAL PRODUCT</text></svg>
