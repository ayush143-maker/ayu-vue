<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d"><title id="t">Tiny useful tools concept dashboard</title><desc id="d">A clean task-focused dashboard concept with three small tool panels and a calm mint palette.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f6f0"/><stop offset="1" stop-color="#dce5d7"/></linearGradient><linearGradient id="tile"><stop stop-color="#fffefa"/><stop offset="1" stop-color="#f0f2e9"/></linearGradient></defs><rect width="780" height="440" rx="12" fill="url(#bg)"/><rect x="22" y="21" width="736" height="398" rx="8" fill="#fafaf6" stroke="#d9e0d3"/><text x="46" y="52" fill="#33372f" font-family="Arial,sans-serif" font-weight="700" font-size="15">little things.</text><text x="46" y="70" fill="#9b9f93" font-family="monospace" font-size="8" letter-spacing="1.3">SMALL UTILS / BIG CLARITY</text><circle cx="704" cy="48" r="13" fill="#e6eddc"/><path d="M699 48h10m-5-5v10" stroke="#7b9168" stroke-width="1.4" stroke-linecap="round"/><path d="M45 89H735" stroke="#e0e4da"/><text x="46" y="121" fill="#34382f" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="-1">A clearer start to your day.</text><text x="46" y="143" fill="#969b8d" font-family="Arial,sans-serif" font-size="11">Three small helpers. Nothing extra.</text>
<rect x="46" y="169" width="211" height="175" rx="7" fill="url(#tile)" stroke="#e1e5dc"/><rect x="63" y="186" width="31" height="31" rx="9" fill="#e2ecd6"/><path d="M72 201l5 5 9-11" fill="none" stroke="#7b9467" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="63" y="246" fill="#42463c" font-family="Arial,sans-serif" font-size="15" font-weight="600">Quick capture</text><text x="63" y="265" fill="#9a9d92" font-family="Arial,sans-serif" font-size="10">Get it out of your head.</text><rect x="63" y="286" width="177" height="35" rx="5" fill="#eef2e8" stroke="#dfe6d6"/><text x="75" y="307" fill="#989c90" font-family="Arial,sans-serif" font-size="10">Write one thing...</text>
<rect x="284" y="169" width="211" height="175" rx="7" fill="url(#tile)" stroke="#e1e5dc"/><rect x="301" y="186" width="31" height="31" rx="9" fill="#e7e4f0"/><circle cx="316" cy="201" r="7" fill="none" stroke="#8a7da9" stroke-width="1.5"/><path d="M316 196v5l4 2" fill="none" stroke="#8a7da9" stroke-width="1.5" stroke-linecap="round"/><text x="301" y="246" fill="#42463c" font-family="Arial,sans-serif" font-size="15" font-weight="600">Time box</text><text x="301" y="265" fill="#9a9d92" font-family="Arial,sans-serif" font-size="10">Give focus a beginning.</text><text x="301" y="310" fill="#42463c" font-family="Arial,sans-serif" font-size="28" font-weight="600">25:00</text><circle cx="461" cy="307" r="14" fill="#262821"/><path d="m458 300 10 7-10 7Z" fill="#f9faf6"/>
