<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" role="img" aria-labelledby="t d"><title id="t">The next thing — an open project canvas</title><desc id="d">A minimal project canvas with a glowing paper orb, sketch lines and open space for future ideas.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5f1e8"/><stop offset="1" stop-color="#e7dfce"/></linearGradient><radialGradient id="glow"><stop stop-color="#d5ebb4"/><stop offset=".6" stop-color="#d5ebb4" stop-opacity=".36"/><stop offset="1" stop-color="#d5ebb4" stop-opacity="0"/></radialGradient></defs><rect width="780" height="440" rx="12" fill="url(#bg)"/><g stroke="#d6d0c1" stroke-width=".7" opacity=".7"><path d="M0 88H780M0 176H780M0 264H780M0 352H780M130 0V440M260 0V440M390 0V440M520 0V440M650 0V440"/></g><text x="30" y="34" fill="#817a6b" font-family="monospace" font-size="9" letter-spacing="1.7">OPEN CANVAS / 005</text><text x="750" y="34" fill="#817a6b" text-anchor="end" font-family="monospace" font-size="9">IN PROGRESS, ALWAYS</text><circle cx="390" cy="219" r="176" fill="url(#glow)"/><g fill="none" stroke="#b9ad94"><circle cx="390" cy="219" r="126"/><circle cx="390" cy="219" r="92" stroke-dasharray="2 8"/><ellipse cx="390" cy="219" rx="172" ry="66" transform="rotate(-35 390 219)"/><ellipse cx="390" cy="219" rx="156" ry="57" transform="rotate(38 390 219)"/></g><circle cx="390" cy="219" r="48" fill="#f8f6ee" fill-opacity=".68" stroke="#b9ad94"/><path d="M371 219h38m-19-19v38" stroke="#968970" stroke-width="1.4" stroke-linecap="round"/><circle cx="521" cy="132" r="8" fill="#c9eb91" stroke="#f8f6ee" stroke-width="4"/><circle cx="261" cy="284" r="6" fill="#c6b5df" stroke="#f8f6ee" stroke-width="3"/><text x="31" y="380" fill="#8a826f" font-family="Arial,sans-serif" font-size="17" font-weight="600">Room for the next good idea.</text><text x="31" y="403" fill="#a19a89" font-family="monospace" font-size="9" letter-spacing="1.1">SKETCH → PROTOTYPE → SOMETHING REAL</text><text x="749" y="403" fill="#a19a89" text-anchor="end" font-family="monospace" font-size="9">NO RUSH. NO NOISE.</text></svg>
